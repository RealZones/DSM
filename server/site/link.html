<link rel="stylesheet" href="bootstrap-dark.css">
<link rel="stylesheet" href="style.css">
<script defer src="link.js"></script>
</head>
<body>
<main class="link-shell">
  <h1 class="page">DSM</h1>
  <section class="panel">
    <h2>Link your Minecraft account</h2>
    <p>Install the <a class="link" href="dragsim-market-client.jar" download>DSM mod for Fabric 26.1.2</a>, then run <code>/dsm link</code> in game.</p>
    <p>Enter the one-time code from Minecraft to open your market profile. Codes expire after five minutes.</p>
    <form id="linkForm" class="controls">
      <label for="linkCode">Link code</label>
      <input id="linkCode" type="text" size="12" maxlength="8" pattern="[0-9A-Fa-f]{8}" spellcheck="false" autocomplete="off" required>
      <button class="btn btn-primary" type="submit">Link account</button>
    </form>
    <p id="linkMessage" class="mb-0 text-muted" role="status"></p>
  </section>
</main>
</body>
</html>
